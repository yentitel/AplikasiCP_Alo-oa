<ion-header>
  <ion-toolbar color="danger">
    <ion-title>Reset Password</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="reset-container">
    <ion-icon
      name="lock-closed-outline"
      class="lock-icon">
    </ion-icon>

    <h2>Buat Password Baru</h2>

    <p class="description">
      Masukkan password baru untuk akun CP-Insight kamu.
    </p>

    <form (ngSubmit)="resetPassword()">
      <ion-item>
        <ion-label position="stacked">Password Baru</ion-label>
        <ion-input
          name="password"
          type="password"
          [(ngModel)]="password"
          placeholder="Minimal 8 karakter"
          required
          minlength="8">
        </ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="stacked">Konfirmasi Password</ion-label>
        <ion-input
          name="konfirmasiPassword"
          type="password"
          [(ngModel)]="konfirmasiPassword"
          placeholder="Masukkan ulang password"
          required>
        </ion-input>
      </ion-item>

      <ion-button
        expand="block"
        type="submit"
        class="reset-button"
        [disabled]="sedangMemproses">
        {{ sedangMemproses ? 'Memproses...' : 'Simpan Password Baru' }}
      </ion-button>
    </form>
  </div>
</ion-content>
